<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><style>*{box-sizing:border-box}body{margin:0;overflow:hidden;background:#13233c;font-family:system-ui;color:white;touch-action:none}canvas{display:block;width:100vw;height:100dvh}#hud{position:absolute;top:18px;left:14px;right:14px;display:flex;justify-content:space-between;pointer-events:none;font-weight:900;text-shadow:0 2px 4px #000}#panel{position:absolute;inset:0;background:#07152bc9;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px}#card{background:linear-gradient(160deg,#345887,#0d1a31);border:2px solid #6be1ff;border-radius:24px;padding:28px;max-width:390px;box-shadow:0 20px 70px #0008}h1{font-size:38px;margin:0;color:#ffdb6c}p{line-height:1.5}button{border:0;border-radius:16px;background:#ffcc43;color:#15203b;padding:16px 30px;font-size:20px;font-weight:900;margin:6px}#hint{position:absolute;bottom:24px;width:100%;text-align:center;font-size:14px;pointer-events:none;color:#e8f4ff}</style></head><body><canvas id="game"></canvas><div id="hud"><span id="level">FASE 1</span><span id="army">⚔ 8</span><span id="coins">🪙 0</span></div><div id="hint">ARRASTE PARA MOVER O EXÉRCITO</div><div id="panel"><div id="card"><h1>ARMY RUSH 3D</h1><p>Comande soldados em 3D, dispare contra inimigos e multiplique seu exército pelos portões!</p><button id="play">JOGAR</button></div></div><script src="game.js"></script></body></html>
